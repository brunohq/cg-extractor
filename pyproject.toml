[project]
name = "cg-extractor"
version = "0.1.0"
description = "Read-only, rate-limited extractor for CentralGest Cloud ERP data, emitting newline-delimited JSON."
license = "MIT"
requires-python = ">=3.12"
dependencies = ["requests>=2.32"]

[project.scripts]
cg-extract = "cg_extract.cli:main"

[dependency-groups]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cg_extract"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
